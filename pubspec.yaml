name: mathmemoryplanet
description: "Math Memory Planet - kids memory and math card games. Fully offline, no ads, no accounts, no data collection."
publish_to: "none"
version: 1.4.4+11

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.4
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/img/
